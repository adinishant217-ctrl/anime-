name: Android Build

on:
  push:
    branches:
      - main
      - develop
      - "freebuff/**"
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      # The runner image already contains the Android SDK. The previous
      # android-actions/setup-android step tried to install a package named
      # "tools" that no longer exists and failed before Gradle ever ran.
      - name: Install required Android platform
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          if [ -z "$SDK_ROOT" ]; then
            echo "Android SDK root is not set on this runner." >&2
            exit 1
          fi
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager || true)"
          fi
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager was not found under $SDK_ROOT." >&2
            exit 1
          fi
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace --no-daemon

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AniStream-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: AniStream-test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 7

      - name: Write build summary
        if: always()
        run: |
          {
            echo "## AniStream Android build"
            echo ""
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Branch: \`${GITHUB_REF_NAME}\`"
            echo "- Tests: \`./gradlew testDebugUnitTest\`"
            echo "- APK: \`app/build/outputs/apk/debug/app-debug.apk\`"
            echo "- Artifact: **AniStream-debug-apk** (Actions run artifacts)"
            echo ""
            if [ "${{ job.status }}" = "success" ]; then
              echo "Build succeeded. Download the APK from the Artifacts section of this run."
            else
              echo "Build failed. Inspect the failing step and its test reports."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
